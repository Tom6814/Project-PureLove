    <!-- ============================================================
         浏览器兼容检测（纯 ES5 语法，所有内核都能执行）
         主应用（Vite + React）要求较新的内核（ES2020 语法 + 关键 API）。
         检测失败 → 显示下方纯 HTML 降级页（风格与主应用一致），
         保证旧内核（如 Android 8 出厂 WebView）也能正常访问站点。
         ============================================================ -->
    <script>
      (function () {
        var ok = true;
        // 关键 ES6+ API（Android 8 出厂 WebView ≈ Chrome 61 已具备；再旧的缺失）
        if (typeof Promise === 'undefined') ok = false;
        if (typeof Symbol === 'undefined') ok = false;
        if (typeof Map === 'undefined' || typeof Set === 'undefined') ok = false;
        if (typeof fetch === 'undefined') ok = false;
        if (typeof requestAnimationFrame === 'undefined') ok = false;
        // ES2020 语法（可选链 / 空值合并）：Vite 现代产物最低要求
        try { new Function('var a = {}; var b = a?.x ?? 1;'); } catch (e) { ok = false; }
        // async / await
        try { new Function('async function f() { await 1; }'); } catch (e) { ok = false; }
        // Array.from / Object.assign 等常用现代方法
        if (typeof Array.prototype.includes === 'undefined') ok = false;
        if (typeof Object.assign === 'undefined') ok = false;
        if (typeof window.fetch === 'undefined') ok = false;

        if (ok) return; // 现代浏览器，正常加载主应用

        // 旧内核：显示 HTML 降级页，隐藏加载进度屏与 React 挂载点
        var loader = document.getElementById('app-loader');
        if (loader) loader.style.display = 'none';
        var fallback = document.getElementById('compat-fallback');
        if (fallback) fallback.style.display = 'flex';
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        try { document.title = 'Project RN - 请升级浏览器'; } catch (e) {}
      })();
    </script>

    <!-- ============================================================

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 加载进度：基于真实资源加载计数（脚本/样式/图片），非模拟动画。
      // 进度由 main.tsx 在 React 渲染 + 首页关键图片下载完成后补到 100% 并淡出。
      (function () {
        var bar = document.getElementById('loader-bar');
        var pct = document.getElementById('loader-pct');
        var v = 0;

        function set(n) {
          v = Math.max(v, n);
          if (bar) bar.style.width = v + '%';
          if (pct) pct.textContent = Math.round(v) + '%';
        }

        // 统计已加载的关键资源（JS / CSS / 图片），据此计算真实进度
        function countLoaded() {
          var entries = performance.getEntriesByType('resource');
          var js = 0, css = 0, img = 0;
          for (var i = 0; i < entries.length; i++) {
            var name = entries[i].name;
            if (/\.js(\?|$)/.test(name)) js++;
            else if (/\.css(\?|$)/.test(name)) css++;
            else if (/\.(webp|avif|png|jpe?g|svg)(\?|$)/i.test(name)) img++;
          }
          return { js: js, css: css, img: img };
        }

        // 依据已加载资源估算目标进度：HTML→15%，脚本/样式/图片逐步推进，封顶 88%
        function computeTarget() {
          var c = countLoaded();
          var js = Math.min(c.js, 6), css = Math.min(c.css, 1), img = Math.min(c.img, 5);
          return 15 + js * 9 + css * 8 + img * 8;
        }

        // 平滑逼近真实进度
        var timer = setInterval(function () {
          var target = computeTarget();
          if (v < target) {
            v += Math.max(1, Math.round((target - v) * 0.35));
            if (bar) bar.style.width = v + '%';
            if (pct) pct.textContent = Math.round(v) + '%';
          }
          if (v >= 88) clearInterval(timer);
        }, 180);

        // 所有非懒加载资源（含首页 Hero 图片）加载完成 → 92%
        window.addEventListener('load', function () { set(92); });

        // 暴露给 main.tsx：确认渲染与首页图片就绪后补到 100% 并隐藏
        window.__finishAppLoader = function () {
          clearInterval(timer);
          set(100);
          var el = document.getElementById('app-loader');
          setTimeout(function () { if (el) el.classList.add('hide'); }, 350);
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 900);
        };
      })();
    </script>
