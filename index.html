<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project RN - 优质本子收集计划</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Project RN 收录 10 大漫画源头的优质本子，站长与社区双重审核，把最甜的恋爱故事留给你。" />
    <style>
      /* 独立加载进度屏：纯内联、零依赖，HTML 解析即显示 */
      #app-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf9f6;transition:opacity .45s ease}
      #app-loader.hide{opacity:0;pointer-events:none}
      #app-loader .track{width:190px;height:3px;background:#f0eeeb;border-radius:999px;overflow:hidden}
      #app-loader .bar{height:100%;width:0%;background:#d9a29a;border-radius:999px;transition:width .3s ease}
      #app-loader .brand{margin-top:18px;font-family:Georgia,serif;font-style:italic;color:#a39b94;font-size:13px;letter-spacing:.3em;text-indent:.3em}
      #app-loader .pct{margin-top:10px;font-family:"Helvetica Neue",Arial,sans-serif;color:#c8c2bc;font-size:11px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="track"><div class="bar" id="loader-bar"></div></div>
      <div class="brand">Project RN</div>
      <div class="pct" id="loader-pct">0%</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 加载进度：基于真实资源加载计数（脚本/样式/图片），非模拟动画。
      // 进度由 main.tsx 在 React 渲染 + 首页关键图片下载完成后补到 100% 并淡出。
      (function () {
        var bar = document.getElementById('loader-bar');
        var pct = document.getElementById('loader-pct');
        var v = 0;

        function set(n) {
          v = Math.max(v, n);
          if (bar) bar.style.width = v + '%';
          if (pct) pct.textContent = Math.round(v) + '%';
        }

        // 统计已加载的关键资源（JS / CSS / 图片），据此计算真实进度
        function countLoaded() {
          var entries = performance.getEntriesByType('resource');
          var js = 0, css = 0, img = 0;
          for (var i = 0; i < entries.length; i++) {
            var name = entries[i].name;
            if (/\.js(\?|$)/.test(name)) js++;
            else if (/\.css(\?|$)/.test(name)) css++;
            else if (/\.(webp|avif|png|jpe?g|svg)(\?|$)/i.test(name)) img++;
          }
          return { js: js, css: css, img: img };
        }

        // 依据已加载资源估算目标进度：HTML→15%，脚本/样式/图片逐步推进，封顶 88%
        function computeTarget() {
          var c = countLoaded();
          var js = Math.min(c.js, 6), css = Math.min(c.css, 1), img = Math.min(c.img, 5);
          return 15 + js * 9 + css * 8 + img * 8;
        }

        // 平滑逼近真实进度
        var timer = setInterval(function () {
          var target = computeTarget();
          if (v < target) {
            v += Math.max(1, Math.round((target - v) * 0.35));
            if (bar) bar.style.width = v + '%';
            if (pct) pct.textContent = Math.round(v) + '%';
          }
          if (v >= 88) clearInterval(timer);
        }, 180);

        // 所有非懒加载资源（含首页 Hero 图片）加载完成 → 92%
        window.addEventListener('load', function () { set(92); });

        // 暴露给 main.tsx：确认渲染与首页图片就绪后补到 100% 并隐藏
        window.__finishAppLoader = function () {
          clearInterval(timer);
          set(100);
          var el = document.getElementById('app-loader');
          setTimeout(function () { if (el) el.classList.add('hide'); }, 350);
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 900);
        };
      })();
    </script>
  </body>
</html>
